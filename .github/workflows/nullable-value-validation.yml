name: PostgREST format diagnosis

on:
  push:
    branches: [ci/postgrest-format]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Format the touched runtime file
        run: >-
          dotnet format packages/Postgrest/Postgrest/Postgrest.csproj
          --severity warn
          --include packages/Postgrest/Postgrest/Linq/WhereExpressionVisitor.cs
      - name: Build after runtime formatting
        run: dotnet build packages/Postgrest/Postgrest/Postgrest.csproj -c Release
      - name: Format the touched test files
        run: >-
          dotnet format packages/Postgrest/Postgrest.Tests/Postgrest.Tests.csproj
          --severity warn
          --include packages/Postgrest/Postgrest.Tests/Linq/WhereClauseTests.cs
          packages/Postgrest/Postgrest.Tests/Linq/LinqQueryTests.cs
      - name: Test after formatting
        run: >-
          dotnet test packages/Postgrest/Postgrest.Tests
          --filter "TestCategory!=E2E"
          --logger "console;verbosity=normal"
      - name: Capture the formatter diff
        if: always()
        run: git diff -- packages/Postgrest > "$RUNNER_TEMP/postgrest-format.patch"
      - name: Preserve the formatter diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postgrest-format-diff
          path: ${{ runner.temp }}/postgrest-format.patch
          if-no-files-found: error