name: Nullable value validation

on:
  push:
    branches: [ci/postgrest-nullable-value]

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Start disposable Supabase stack
        run: supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1
      - name: Full repository quality gate
        run: bash scripts/quality-gate/gate.sh packages
      - name: Preserve quality gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-gate-reports
          path: '**/.gate/report.json'
          include-hidden-files: true
          if-no-files-found: warn
      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup

  windows-postgrest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: PostgREST unit and contract tests
        run: >-
          dotnet test packages/Postgrest/Postgrest.Tests
          --filter "TestCategory!=E2E"
          --logger "console;verbosity=normal"