name: Null set validation

on:
  push:
    branches: [ci/postgrest-null-set]

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify formatting of changed C# files
        run: |
          format_status=0
          dotnet format "$PWD/packages/Postgrest/Postgrest/Postgrest.csproj" --verify-no-changes --severity warn --include packages/Postgrest/Postgrest/Table.cs || format_status=1
          dotnet format "$PWD/packages/Postgrest/Postgrest.Tests/Postgrest.Tests.csproj" --verify-no-changes --severity warn --include packages/Postgrest/Postgrest.Tests/Linq/SetClauseTests.cs packages/Postgrest/Postgrest.Tests/Linq/LinqQueryTests.cs packages/Postgrest/Postgrest.Tests/Models/UserWithJsonData.cs packages/Postgrest/Postgrest.Tests/Writing/UpdateApprovalTests.cs || format_status=1
          exit "$format_status"

  quality-gate:
    needs: format-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Use PR base for changed-file format checks
        run: |
          git update-ref refs/remotes/origin/master 296b165392cdaaa97159d918c96d97f7c954d531
          git symbolic-ref refs/remotes/origin/HEAD refs/remotes/origin/master
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Start disposable Supabase stack
        run: supabase start > "$RUNNER_TEMP/supabase-start.log" 2>&1
      - name: Full repository quality gate
        run: bash scripts/quality-gate/gate.sh packages
      - name: Preserve quality gate reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: null-set-quality-gate-reports
          path: '**/.gate/report.json'
          include-hidden-files: true
          if-no-files-found: warn
      - name: Stop disposable Supabase stack
        if: always()
        run: supabase stop --no-backup

  windows-postgrest:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: PostgREST unit and contract tests
        run: >-
          dotnet test packages/Postgrest/Postgrest.Tests
          --filter "TestCategory!=E2E"
          --logger "console;verbosity=normal"